<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شهر من</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#06141b;--panel:#102a34;--panel2:#163b47;--line:#285866;--gold:#f4c45d;--text:#f4f7f8;--muted:#9fb8c0;--red:#9f3d45;--green:#28704e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b5365 0,#06141b 48%);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}.app{max-width:620px;margin:auto;padding:14px 12px 92px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 14px}.title{font-size:25px;font-weight:900}.pill{background:#17333d;border:1px solid #326271;border-radius:14px;padding:8px 11px;font-size:12px;color:#dce8eb}.section{margin:10px 0;background:#0d252eea;border:1px solid var(--line);border-radius:21px;padding:12px}.section h2{margin:0 0 11px;font-size:17px}.scene{position:relative;height:310px;overflow:hidden;border-radius:22px;background:linear-gradient(#0e4a60 0 48%,#326b55 48% 68%,#253c43 68%);border:1px solid #3a7380;box-shadow:0 15px 35px #0005}.sun{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffd76b;left:28px;top:25px;box-shadow:0 0 35px #ffd76b88}.mount{position:absolute;bottom:93px;left:-20px;width:110%;height:105px;background:#244d51;clip-path:polygon(0 100%,18% 42%,31% 73%,48% 25%,65% 72%,81% 35%,100% 100%)}.road{position:absolute;bottom:0;left:0;right:0;height:82px;background:#253239;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}.citytitle{position:absolute;right:13px;top:13px;background:#07171ddd;border:1px solid #385d66;border-radius:14px;padding:9px 11px;font-weight:800}.citytitle small{color:var(--muted);font-weight:500}.building{position:absolute;bottom:67px;width:58px;border-radius:7px 7px 2px 2px;background:#d0a061;border:2px solid #6b4635;box-shadow:0 8px 12px #0006}.building:before{content:"";position:absolute;left:-6px;right:-6px;top:-21px;border-left:32px solid transparent;border-right:32px solid transparent;border-bottom:22px solid #925943}.building i{display:block;height:10px;margin:7px 5px;background:repeating-linear-gradient(90deg,#83c7d2 0 8px,transparent 8px 13px)}.b1{right:24px;height:118px}.b2{right:94px;height:82px;background:#dfbd72}.b3{right:174px;height:135px;background:#78abc8}.b4{right:254px;height:92px;background:#9170b2}.b5{right:334px;height:68px;background:#68a978}.statbar{position:absolute;bottom:9px;left:10px;right:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:#07131ae6;border:1px solid #315762;border-radius:13px;padding:7px;text-align:center;font-size:10px}.stat b{display:block;font-size:14px;margin-top:2px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:var(--panel2);border:1px solid #2b5965;border-radius:15px;padding:11px;min-height:76px}.card strong{display:block;font-size:18px;margin-top:4px}.muted{color:var(--muted);font-size:11px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:1px solid #315e69;border-radius:14px;padding:12px 8px;background:#173b46;color:#fff;font-weight:800}.btn.primary{background:linear-gradient(135deg,#dca32e,#f5ce70);color:#152229;border:0}.btn.danger{background:#693039}.btn.green{background:#205e43}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#16343e;border:1px solid #285561;border-radius:14px;padding:10px;margin:7px 0}.row button{border:0;border-radius:10px;padding:9px 10px;background:var(--gold);color:#152229;font-weight:900}.tag{display:inline-block;padding:4px 7px;border-radius:9px;background:#193c47;color:#cfe0e5;font-size:10px;margin:2px}.input{width:100%;padding:12px;border-radius:12px;border:1px solid #38616b;background:#081a22;color:#fff;margin:5px 0}.nav{position:fixed;z-index:8;bottom:0;left:0;right:0;background:#07161edb;backdrop-filter:blur(14px);border-top:1px solid #294e59;padding:8px}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#9fb7be;font-size:10px}.nav button b{display:block;font-size:21px;margin-bottom:3px}.nav .active{color:var(--gold)}.toast{position:fixed;z-index:20;left:12px;right:12px;bottom:78px;background:#091b23f2;border:1px solid #3c6873;border-radius:15px;padding:12px;text-align:center}.hidden{display:none}.loader{text-align:center;padding:55px 15px;color:#bcd0d5}
</style></head>
<body>
<div class="app"><div class="top"><div class="title">🏙️ شهر من</div><div class="pill" id="mayor">در حال ورود...</div></div><main id="app"><div class="loader">در حال بارگذاری شهر...</div></main></div>
<div class="nav"><div class="navin"><button onclick="show('home')" id="n-home"><b>🏙️</b>شهر</button><button onclick="show('buildings')" id="n-buildings"><b>🏗️</b>ساختمان</button><button onclick="show('crisis')" id="n-crisis"><b>🚨</b>بحران</button><button onclick="show('map')" id="n-map"><b>🗺️</b>نقشه</button><button onclick="show('more')" id="n-more"><b>☰</b>همه</button></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let S=null;
const names={police:'🚓 پلیس',fire:'🚒 آتش‌نشانی',hospital:'🏥 بیمارستان',power:'⚡ نیروگاه',water:'💧 تصفیه‌خانه',school:'🏫 مدرسه',university:'🎓 دانشگاه',park:'🌳 پارک',shopping:'🏪 مرکز تجاری',stadium:'🏟️ ورزشگاه',recycling:'♻️ بازیافت',emergency:'🚑 مرکز امداد',roads:'🛣️ راه‌ها',waste:'🗑️ مدیریت پسماند',industry:'🏭 صنعت'};
const resNames={coins:'💰 سکه',materials:'🧱 مصالح',food:'🍞 غذا',energy:'⚡ انرژی',water:'💧 آب',equipment:'🧰 تجهیزات'};
const crisisNames={theft:'دزدی',fire:'آتش‌سوزی',disease:'بیماری',power:'قطعی برق',water:'کمبود آب',pollution:'آلودگی',storm:'طوفان',snow:'برف شدید',heat:'گرمای شدید',garbage:'انباشت زباله',accident:'حادثه',economic:'بحران اقتصادی',flood:'سیل',cold:'سرما',infrastructure:'زیرساخت'};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':tg?.initData||'','X-Telegram-User-Id':String(tg?.initDataUnsafe?.user?.id||'')};let r=await fetch(path,opt);let raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(raw||('خطای سرور '+r.status))}if(!r.ok)throw Error(d.message||d.text||'خطای سرور');return d}
async function load(){try{S=await api('/webapp/api/state');if(S?.ok===false)throw Error(S.message||'خطا');document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show('home')}catch(e){document.getElementById('app').innerHTML='<div class="loader">❌ '+esc(e.message||'خطای نامشخص')+'<br><small>Mini App نتوانست اطلاعات شهر را دریافت کند.</small></div>'}}
function scene(){let c=S.city;return `<div class="scene"><div class="sun"></div><div class="mount"></div><div class="road"></div><div class="citytitle">🏙️ ${esc(c.city_name||'شهر من')}<br><small>👑 ${esc(S.player.first_name||'شهردار')} · ⭐ سطح ${S.player.level}</small></div><div class="building b1"><i></i><i></i></div><div class="building b2"><i></i></div><div class="building b3"><i></i><i></i><i></i></div><div class="building b4"><i></i><i></i></div><div class="building b5"><i></i></div><div class="statbar"><div class="stat">👥<b>${num(c.population)}</b>جمعیت</div><div class="stat">😊<b>${c.satisfaction}%</b>رضایت</div><div class="stat">📈<b>${c.economy}%</b>اقتصاد</div></div></div>`}
function home(){let c=S.city;return scene()+`<div class="section"><h2>📊 وضعیت شهر</h2><div class="grid"><div class="card">🛡️ امنیت<strong>${c.security}%</strong></div><div class="card">❤️ سلامت<strong>${c.health}%</strong></div><div class="card">⚡ برق<strong>${c.power}%</strong></div><div class="card">💧 آب<strong>${c.water}%</strong></div><div class="card">🎓 آموزش<strong>${c.education}%</strong></div><div class="card">🌳 تفریح<strong>${c.recreation}%</strong></div></div></div><div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div></div><div class="section"><div class="buttons"><button class="btn primary" onclick="show('buildings')">🏗️ ساخت‌وساز</button><button class="btn ${S.crisis?'danger':'green'}" onclick="show('crisis')">${S.crisis?'🚨 بحران فعال':'✅ بحران‌ها'}</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function resourceCards(r){return Object.entries(resNames).map(([k,n])=>`<div class="card">${n}<strong>${num(r[k])}</strong><span class="muted">+۲۰ در ساعت پایه</span></div>`).join('')}
function buildings(){let map=Object.fromEntries((S.buildings||[]).map(x=>[x.type,x.level]));let active=S.construction;return `<div class="section"><h2>🏗️ ساختمان‌های شهر</h2>${active?`<div class="card">⏳ در حال ساخت: <b>${names[active.building_type]||active.building_type}</b><br><span class="muted">تا سطح ${active.target_level} · آماده: ${fmtDate(active.ready_at)}</span></div>`:''}${Object.entries(names).map(([k,n])=>{let lv=map[k]||0;return `<div class="row"><div><b>${n}</b><div class="muted">${lv?'سطح '+lv:'هنوز ساخته نشده'}</div></div><button onclick="build('${k}')">${lv?'⬆️ ارتقا':'🔨 ساخت'}</button></div>`}).join('')}</div><div class="section"><h2>🔧 خسارت‌ها</h2>${S.damages?.length?S.damages.map(d=>`<div class="row"><div>🚨 ${esc(d.disaster_name)}<br><span class="muted">${names[d.building_type]||d.building_type} · ${num(d.damage)} 🪙</span></div><button onclick="repair(${d.id})">🔧 تعمیر</button></div>`).join(''):'<div class="card">✅ خسارت فعالی وجود ندارد.</div>'}</div>`}
function crisis(){let x=S.crisis;if(!x)return `<div class="section"><h2>🚨 بحران‌ها</h2><div class="card" style="text-align:center">🌤️<br><strong>شهر آرام است</strong><br><span class="muted">فعلاً بحران فعالی وجود ندارد.</span></div></div>`;return `<div class="section"><h2>🚨 بحران فعال</h2><div class="card"><strong>⚠️ ${crisisNames[x.crisis_type]||esc(x.crisis_type)}</strong><p>شدت بحران: <b>${x.severity}</b></p><p class="muted">ایجاد: ${fmtDate(x.created_at)}</p><button class="btn primary" onclick="resolve(${x.id})">🛠️ مدیریت بحران</button></div></div>`}
function map(){let c=S.city;return `<div class="section"><h2>🗺️ نقشه زنده شهر</h2>${scene()}<div class="grid" style="margin-top:9px"><div class="card">🗺️ زمین<strong>${c.land}</strong></div><div class="card">🏘️ روستا<strong>${c.villages}</strong></div><div class="card">🏠 ظرفیت مسکن<strong>${num(c.housing_capacity)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><button class="btn primary" style="width:100%;margin-top:9px" onclick="expand()">🏘️ جذب روستا</button></div>`}
function economy(){let c=S.city,r=S.resources;return `<div class="section"><h2>💰 اقتصاد شهر</h2><div class="grid"><div class="card">📈 قدرت اقتصاد<strong>${c.economy}%</strong></div><div class="card">🏷️ مالیات<strong>${c.tax_rate}%</strong></div><div class="card">👥 جمعیت<strong>${num(c.population)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><div class="buttons" style="margin-top:9px"><button class="btn primary" onclick="act({action:'tax_up'})">📈 مالیات +۲٪</button><button class="btn" onclick="act({action:'tax_down'})">📉 مالیات -۲٪</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function market(){let offers=S.offers||[];return `<div class="section"><h2>🏪 بازار شهر</h2>${offers.length?offers.map(o=>`<div class="row"><div><b>${resNames[o.resource_type]||o.resource_type}</b> × ${num(o.amount)}<br><span class="muted">${num(o.price)} سکه · فروشنده: ${esc(o.first_name||'شهردار')}</span></div><button onclick="buy(${o.id})">🛒 خرید</button></div>`).join(''):'<div class="card">بازار فعلاً خالی است.</div>'}<button class="btn primary" style="width:100%;margin-top:9px" onclick="sellForm()">📤 فروش منابع</button></div>`}
function sellForm(){document.getElementById('app').innerHTML=`<div class="section"><h2>📤 فروش منابع</h2><select id="sr" class="input"><option value="food">🍞 غذا</option><option value="materials">🧱 مصالح</option><option value="energy">⚡ انرژی</option><option value="water">💧 آب</option><option value="equipment">🧰 تجهیزات</option></select><input id="sa" class="input" type="number" placeholder="مقدار"><input id="sp" class="input" type="number" placeholder="قیمت کل به سکه"><button class="btn primary" style="width:100%" onclick="sell()">📤 ثبت فروش</button><button class="btn" style="width:100%;margin-top:8px" onclick="show('market')">🔙 بازار</button></div>`}
function social(){let f=S.social?.friends||[],p=S.social?.pending||[];return `<div class="section"><h2>🤝 اجتماعی</h2><div class="card"><b>👥 دوستان: ${f.length}</b><br>${f.length?f.map(x=>`<span class="tag">${esc(x.first_name)} · ${esc(x.city_name)}</span>`).join(' '):'<span class="muted">هنوز دوستی ثبت نشده.</span>'}</div><div class="card" style="margin-top:8px"><b>📨 درخواست‌ها</b>${p.length?p.map(x=>`<div class="row"><span>${esc(x.first_name)} · ${x.user_id}</span><button onclick="acceptFriend(${x.id})">✅ قبول</button></div>`).join(''):'<div class="muted">درخواست جدیدی نداری.</div>'}</div><input id="fid" class="input" type="number" placeholder="شناسه عددی بازیکن"><button class="btn primary" style="width:100%" onclick="sendFriend()">📨 ارسال درخواست دوستی</button></div>`}
function ranking(){let r=S.ranking||{};return `<div class="section"><h2>🏆 رقابت هفتگی</h2><div class="card">📅 هفته: ${esc(r.week||'-')}<br>📍 رتبه تو: <b>${r.my_rank||'-'}</b> · امتیاز: <b>${num(r.my_score)}</b></div>${(r.top||[]).map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(''+(i+1)+'.')} ${esc(x.first_name)}<br><small class="muted">${esc(x.city_name)}</small></span><b>${num(x.score)}</b></div>`).join('')}</div>`}
function news(){return `<div class="section"><h2>📰 روزنامه شهر</h2>${S.news?.length?S.news.map(n=>`<div class="card" style="margin:7px 0">${esc(n.text)}<div class="muted" style="margin-top:5px">${fmtDate(n.created_at)}</div></div>`).join(''):'<div class="card">هنوز خبر خاصی ثبت نشده.</div>'}</div>`}
function more(){return `<div class="section"><h2>🎮 همه امکانات بازی</h2><div class="buttons"><button class="btn" onclick="show('resources')">📦 منابع</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button><button class="btn" onclick="show('social')">🤝 اجتماعی</button><button class="btn" onclick="show('ranking')">🏆 رقابت</button><button class="btn" onclick="show('news')">📰 روزنامه</button><button class="btn" onclick="show('map')">🗺️ توسعه</button><button class="btn" onclick="show('buildings')">🏗️ ساختمان‌ها</button><button class="btn" onclick="show('crisis')">🚨 بحران‌ها</button></div></div>`}
function resources(){return `<div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div><div class="muted" style="margin-top:10px">درآمد پایه هر منبع: ۲۰ واحد در ساعت. درآمد ساختمان‌های مرتبط با ساخت/ارتقا در محاسبات شهر اعمال می‌شود.</div></div>`}
function show(p){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let id=['home','buildings','crisis','map','more'].includes(p)?p:'more';document.getElementById('n-'+id).classList.add('active');let html={home,buildings,crisis,map,more,economy,market,social,ranking,news,resources}[p]?.();document.getElementById('app').innerHTML=html||more()}
async function act(payload){try{let d=await api('/webapp/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast(d.message||'انجام شد');await load()}catch(e){toast('❌ '+e.message)}}
function build(k){if(confirm('ساخت/ارتقای این ساختمان شروع شود؟'))act({action:'build',building:k})}function resolve(id){if(confirm('بحران مدیریت شود؟'))act({action:'resolve',crisis_id:id})}function expand(){if(confirm('روستای جدید اضافه شود؟'))act({action:'expand_village'})}function buy(id){if(confirm('این پیشنهاد خریداری شود؟'))act({action:'market_buy',offer_id:id})}function sell(){act({action:'market_sell',resource:document.getElementById('sr').value,amount:Number(document.getElementById('sa').value),price:Number(document.getElementById('sp').value)})}function sendFriend(){act({action:'friend_request',user_id:Number(document.getElementById('fid').value)})}function acceptFriend(id){act({action:'friend_accept',request_id:id})}function repair(id){if(confirm('خسارت با هزینه فعلی تعمیر شود؟'))act({action:'damage_repair',event_id:id})}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3200)}function num(x){return Number(x||0).toLocaleString('fa-IR')}function fmtDate(x){if(!x)return '-';try{return new Date(x).toLocaleString('fa-IR')}catch(e){return String(x)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script></body></html>
