<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>شهر من</title>
<meta name="version" content="20260920-city-live-3">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#07131a;--panel:#102a34;--panel2:#173c47;--line:#2b5e6b;--gold:#f4c45d;--text:#f5f8f9;--muted:#9db8c0;--red:#9d3e46;--green:#28714f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1b5365 0,#06141b 52%);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}.app{max-width:720px;margin:auto;padding:12px 10px 94px}.top{display:flex;align-items:center;justify-content:space-between;padding:7px 4px 12px}.title{font-size:25px;font-weight:900}.pill{background:#17333d;border:1px solid #326271;border-radius:14px;padding:8px 11px;font-size:12px;color:#dce8eb}.section{margin:10px 0;background:#0d252eeb;border:1px solid var(--line);border-radius:21px;padding:12px}.section h2{margin:0 0 11px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{background:var(--panel2);border:1px solid #2b5965;border-radius:15px;padding:11px;min-height:76px}.card strong{display:block;font-size:18px;margin-top:4px}.muted{color:var(--muted);font-size:11px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:1px solid #315e69;border-radius:14px;padding:12px 8px;background:#173b46;color:#fff;font-weight:800}.btn.primary{background:linear-gradient(135deg,#dca32e,#f5ce70);color:#152229;border:0}.btn.danger{background:#693039}.btn.green{background:#205e43}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#16343e;border:1px solid #285561;border-radius:14px;padding:10px;margin:7px 0}.row button{border:0;border-radius:10px;padding:9px 10px;background:var(--gold);color:#152229;font-weight:900}.tag{display:inline-block;padding:4px 7px;border-radius:9px;background:#193c47;color:#cfe0e5;font-size:10px;margin:2px}.input{width:100%;padding:12px;border-radius:12px;border:1px solid #38616b;background:#081a22;color:#fff;margin:5px 0}
/* شهر از بالا: زمین بزرگ، مسیرها و قطعه‌های ساختمانی */
.town{position:relative;height:430px;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#74b9d0 0 18%,#79bd67 18% 100%);border:2px solid #3c7881;box-shadow:0 18px 45px #0008}
.town:before{content:"";position:absolute;inset:72px 0 0;background:repeating-linear-gradient(0deg,transparent 0 48px,#ffffff16 49px 50px),repeating-linear-gradient(90deg,transparent 0 48px,#ffffff16 49px 50px);opacity:.55}
.ground{position:absolute;inset:72px 12px 12px;border-radius:20px;background:linear-gradient(135deg,#6cae58,#91c86b 48%,#5b9b51);box-shadow:inset 0 0 50px #254b2d55;overflow:hidden}
.road{position:absolute;background:#56666a;box-shadow:inset 0 3px #ffffff20,inset 0 -3px #0004}.road.h{height:34px;left:-5%;right:-5%;top:47%}.road.v{width:34px;top:-5%;bottom:-5%;left:48%}.road.d1{height:25px;width:85%;left:7%;top:30%;transform:rotate(16deg)}.road.d2{height:25px;width:82%;left:10%;top:67%;transform:rotate(-14deg)}
.plot{position:absolute;width:86px;height:64px;background:#4d8f48cc;border:2px solid #cce58b55;border-radius:13px;box-shadow:0 6px 12px #244c2944}.plot:after{content:"";position:absolute;inset:7px;border:1px dashed #d8f0a633;border-radius:8px}
.house{position:absolute;width:62px;height:47px;z-index:3;filter:drop-shadow(0 7px 5px #0007)}.house .roof{position:absolute;left:4px;right:4px;top:0;height:26px;background:var(--roof,#a64b40);clip-path:polygon(50% 0,100% 65%,88% 75%,50% 30%,12% 75%,0 65%)}.house .body{position:absolute;left:12px;right:12px;bottom:0;height:31px;border-radius:4px;background:var(--body,#d9b36a);border:2px solid #694c39}.house .window{position:absolute;left:20px;bottom:9px;width:9px;height:9px;background:#9ed7df;border:1px solid #315b61;box-shadow:17px 0 #9ed7df}.house.lv2{transform:scale(1.12)}.house.lv3{transform:scale(1.24)}.house.lv4{transform:scale(1.38)}.house.lv5{transform:scale(1.53)}
.landmark{position:absolute;z-index:4;font-size:32px;text-align:center;line-height:1;filter:drop-shadow(0 5px 4px #0007);animation:bob 2.8s ease-in-out infinite}.landmark small{display:block;font-size:8px;background:#07151add;border:1px solid #ffffff22;border-radius:7px;padding:3px 5px;margin-top:4px;white-space:nowrap}.person,.car{position:absolute;z-index:6;animation-timing-function:linear;animation-iteration-count:infinite;pointer-events:none}.person{font-size:16px;animation-name:walk;animation-duration:8s}.car{font-size:21px;animation-name:drive;animation-duration:6s}.tree{position:absolute;z-index:2;font-size:24px;filter:drop-shadow(0 4px 3px #0006)}
.weather{position:absolute;inset:0;z-index:12;pointer-events:none;display:none}.weather.show{display:block}.rain{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 22px,#9bdcff44 23px 25px);animation:rain .45s linear infinite}.stormflash{position:absolute;inset:0;background:#dff7ff55;animation:flash 2.5s infinite}.fireglow{position:absolute;width:110px;height:110px;border-radius:50%;background:#ff6a1844;box-shadow:0 0 45px #ff7a1f99;animation:pulse 1s infinite}.damage-mark{position:absolute;z-index:15;font-size:30px;animation:damage 1s infinite}.crisisBanner{position:absolute;z-index:20;top:10px;left:10px;right:10px;background:#551d25e8;border:1px solid #d85a63;border-radius:13px;padding:9px 11px;font-weight:800;box-shadow:0 6px 18px #0006}.town-title{position:absolute;z-index:20;top:10px;right:10px;background:#07171ddd;border:1px solid #385d66;border-radius:14px;padding:9px 11px;font-weight:800}.town-title small{color:var(--muted);font-weight:500}.town-stats{position:absolute;z-index:20;bottom:9px;left:9px;right:9px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:#07131ae8;border:1px solid #315762;border-radius:13px;padding:7px;text-align:center;font-size:10px;backdrop-filter:blur(5px)}.stat b{display:block;font-size:14px;margin-top:2px}
.nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:#07161eea;backdrop-filter:blur(14px);border-top:1px solid #294e59;padding:8px}.navin{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}.nav button{border:0;background:none;color:#9fb7be;font-size:10px;padding:2px}.nav button b{display:block;font-size:21px;margin-bottom:3px}.nav button:nth-child(3) b{font-size:26px}.nav button:nth-child(3){transform:translateY(-4px)}.nav .active{color:var(--gold)}
.toast{position:fixed;z-index:50;left:12px;right:12px;bottom:78px;background:#091b23f2;border:1px solid #3c6873;border-radius:15px;padding:12px;text-align:center}.hidden{display:none}.loader{text-align:center;padding:55px 15px;color:#bcd0d5}@keyframes walk{0%{transform:translateX(-30px)}50%{transform:translateX(260px)}100%{transform:translateX(620px)}}@keyframes drive{0%{transform:translateX(-70px)}100%{transform:translateX(760px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes rain{to{transform:translateX(-20px) translateY(25px)}}@keyframes flash{0%,92%,100%{opacity:0}94%{opacity:1}}@keyframes pulse{50%{transform:scale(1.15);opacity:.65}}@keyframes damage{50%{transform:translateY(-7px) rotate(-8deg)}}
@media(max-width:500px){.town{height:390px}.house{transform:scale(.9)}.house.lv2{transform:scale(1)}.house.lv3{transform:scale(1.1)}.house.lv4{transform:scale(1.2)}.house.lv5{transform:scale(1.3)}}
</style></head>
<body>
<div class="app"><div class="top"><div class="title">🏙️ شهر من</div><div class="pill" id="mayor">در حال ورود...</div></div><main id="app"><div class="loader">در حال بارگذاری شهر...</div></main></div>
<div class="nav"><div class="navin"><button onclick="show('buildings')" id="n-buildings"><b>🏗️</b>ساختمان</button><button onclick="show('crisis')" id="n-crisis"><b>🚨</b>بحران</button><button onclick="show('home')" id="n-home"><b>🏙️</b>شهر</button><button onclick="show('map')" id="n-map"><b>🗺️</b>نقشه</button><button onclick="show('more')" id="n-more"><b>☰</b>امکانات</button></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let S=null;
const names={police:'🚓 پلیس',fire:'🚒 آتش‌نشانی',hospital:'🏥 بیمارستان',power:'⚡ نیروگاه',water:'💧 تصفیه‌خانه',school:'🏫 مدرسه',university:'🎓 دانشگاه',park:'🌳 پارک',shopping:'🏪 مرکز تجاری',stadium:'🏟️ ورزشگاه',recycling:'♻️ بازیافت',emergency:'🚑 مرکز امداد',roads:'🛣️ راه‌ها',waste:'🗑️ مدیریت پسماند',industry:'🏭 صنعت'};
const resNames={coins:'💰 سکه',materials:'🧱 مصالح',food:'🍞 غذا',energy:'⚡ انرژی',water:'💧 آب',equipment:'🧰 تجهیزات'};
const crisisNames={theft:'دزدی',fire:'آتش‌سوزی',disease:'بیماری',power:'قطعی برق',water:'کمبود آب',pollution:'آلودگی',storm:'طوفان',snow:'برف شدید',heat:'گرمای شدید',garbage:'انباشت زباله',accident:'حادثه',economic:'بحران اقتصادی',flood:'سیل',cold:'سرما',infrastructure:'زیرساخت'};
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':tg?.initData||'','X-Telegram-User-Id':String(tg?.initDataUnsafe?.user?.id||'')};
  const pageParams=new URLSearchParams(window.location.search);
  const authKeys=['uid','exp','sig'];
  const hasAuth=authKeys.every(k=>pageParams.has(k));
  if(hasAuth){
    const sep=path.includes('?')?'&':'?';
    path+=sep+'uid='+encodeURIComponent(pageParams.get('uid'))+'&exp='+encodeURIComponent(pageParams.get('exp'))+'&sig='+encodeURIComponent(pageParams.get('sig'));
  }
  let r=await fetch(path,opt);let raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(raw||('خطای سرور '+r.status))}if(!r.ok)throw Error(d.message||d.text||'خطای سرور');return d
}
function scene(){
 let c=S.city||{}, levels=Object.fromEntries((S.buildings||[]).map(x=>[x.type,Number(x.level||0)]));
 const order=['roads','police','fire','hospital','power','water','school','university','park','shopping','stadium','recycling','emergency','waste','industry'];
 const pos=[[13,27],[30,23],[50,25],[70,22],[18,47],[36,43],[57,45],[76,44],[10,68],[29,66],[49,70],[68,66],[84,67],[41,80],[62,82]];
 const built=order.filter(k=>(levels[k]||0)>0);
 let houses=built.map((k,i)=>{let lv=levels[k],p=pos[i%pos.length],name=names[k]||k,emoji=name.split(' ')[0];let roof=['#a94b42','#6e76b8','#d18b39','#4c8b7d','#8a5b9e'][i%5];return `<div class="landmark" style="left:${p[0]}%;top:${p[1]}%"><div class="house lv${Math.min(lv,5)}" style="--roof:${roof}"><div class="roof"></div><div class="body"><div class="window"></div></div></div><small>${emoji} ${esc(name.replace(/^\S+\s/,''))} · سطح ${lv}</small></div>`}).join('');
 const trees=[[4,36],[88,30],[8,83],[92,78],[24,87],[79,86],[84,52],[5,56]].map(p=>`<div class="tree" style="left:${p[0]}%;top:${p[1]}%">🌳</div>`).join('');
 let activity=Math.max(2,Math.min(14,Math.round((Number(c.population||0)/50)*(Number(c.satisfaction||0)/70))));
 if(Number(c.satisfaction||0)<40) activity=Math.max(1,Math.floor(activity*.45));
 if(S.crisis) activity=Math.max(1,Math.floor(activity*.6));
 let people=Array.from({length:Math.min(activity,14)},(_,i)=>`<div class="person" style="left:${(i*11)%90}%;top:${35+(i*7)%45}%">${i%3===0?'🚶':'🧍'}</div>`).join('');
 let cars=Array.from({length:Math.min(2+Math.floor(activity/4),5)},(_,i)=>`<div class="car" style="left:${i*18}%;top:${46+(i%2)*23}%">${i%2?'🚙':'🚗'}</div>`).join('');
 let ev=S.live_events?.[0], weather='';
 if(ev){let dn=String(ev.disaster_name||''); if(dn.includes('⚡')) weather='<div class="weather show"><div class="stormflash"></div></div>'; else if(dn.includes('🌧️')||dn.includes('🌨️')||dn.includes('❄️')||dn.includes('🌊')) weather='<div class="weather show"><div class="rain"></div></div>'; else if(dn.includes('🔥')) weather='<div class="weather show"><div class="fireglow" style="right:30%;top:45%"></div></div>';}
 let mark=ev&&ev.building_type?`<div class="damage-mark" style="left:${pos[order.indexOf(ev.building_type)>=0?order.indexOf(ev.building_type)%pos.length:0][0]}%;top:${pos[order.indexOf(ev.building_type)>=0?order.indexOf(ev.building_type)%pos.length:0][1]-7}%">⚠️</div>`:'';
 let banner=ev?`<div class="crisisBanner">🚨 ${esc(ev.disaster_name)} · ${ev.building_type?(names[ev.building_type]||ev.building_type):'شهر'}${ev.damage?` · خسارت ${num(ev.damage)} 🪙`:''}</div>`:(S.crisis?`<div class="crisisBanner">⚠️ بحران فعال: ${crisisNames[S.crisis.crisis_type]||esc(S.crisis.crisis_type)}</div>`:'');
 return `<div class="town"><div class="town-title">🏙️ ${esc(c.city_name||'شهر من')}<br><small>👑 ${esc(S.player.first_name||'شهردار')} · ⭐ سطح ${S.player.level}</small></div>${banner}<div class="ground"><div class="road h"></div><div class="road v"></div><div class="road d1"></div><div class="road d2"></div>${trees}${houses}${people}${cars}</div>${weather}${mark}<div class="town-stats"><div class="stat">👥<b>${num(c.population)}</b>جمعیت</div><div class="stat">😊<b>${c.satisfaction}%</b>رضایت</div><div class="stat">📈<b>${c.economy}%</b>اقتصاد</div></div></div>`;
}
function home(){let c=S.city;return scene()+`<div class="section"><h2>📊 وضعیت شهر</h2><div class="grid"><div class="card">🛡️ امنیت<strong>${c.security}%</strong></div><div class="card">❤️ سلامت<strong>${c.health}%</strong></div><div class="card">⚡ برق<strong>${c.power}%</strong></div><div class="card">💧 آب<strong>${c.water}%</strong></div><div class="card">🎓 آموزش<strong>${c.education}%</strong></div><div class="card">🌳 تفریح<strong>${c.recreation}%</strong></div></div></div><div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div></div><div class="section"><div class="buttons"><button class="btn primary" onclick="show('buildings')">🏗️ ساخت‌وساز</button><button class="btn ${S.crisis?'danger':'green'}" onclick="show('crisis')">${S.crisis?'🚨 بحران فعال':'✅ بحران‌ها'}</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function resourceCards(r){return Object.entries(resNames).map(([k,n])=>`<div class="card">${n}<strong>${num(r[k])}</strong><span class="muted">+۲۰ در ساعت پایه</span></div>`).join('')}
function buildings(){let map=Object.fromEntries((S.buildings||[]).map(x=>[x.type,x.level]));let active=S.construction;return `<div class="section"><h2>🏗️ ساختمان‌های شهر</h2>${active?`<div class="card">⏳ در حال ساخت: <b>${names[active.building_type]||active.building_type}</b><br><span class="muted">تا سطح ${active.target_level} · آماده: ${fmtDate(active.ready_at)}</span></div>`:''}${Object.entries(names).map(([k,n])=>{let lv=map[k]||0;return `<div class="row"><div><b>${n}</b><div class="muted">${lv?'سطح '+lv:'هنوز ساخته نشده'}</div></div><button onclick="build('${k}')">${lv?'⬆️ ارتقا':'🔨 ساخت'}</button></div>`}).join('')}</div><div class="section"><h2>🔧 خسارت‌ها</h2>${S.damages?.length?S.damages.map(d=>`<div class="row"><div>🚨 ${esc(d.disaster_name)}<br><span class="muted">${names[d.building_type]||d.building_type} · ${num(d.damage)} 🪙</span></div><button onclick="repair(${d.id})">🔧 تعمیر</button></div>`).join(''):'<div class="card">✅ خسارت فعالی وجود ندارد.</div>'}</div>`}
function crisis(){let x=S.crisis;if(!x)return `<div class="section"><h2>🚨 بحران‌ها</h2><div class="card" style="text-align:center">🌤️<br><strong>شهر آرام است</strong><br><span class="muted">فعلاً بحران فعالی وجود ندارد.</span></div></div>`;return `<div class="section"><h2>🚨 بحران فعال</h2><div class="card"><strong>⚠️ ${crisisNames[x.crisis_type]||esc(x.crisis_type)}</strong><p>شدت بحران: <b>${x.severity}</b></p><p class="muted">ایجاد: ${fmtDate(x.created_at)}</p><button class="btn primary" onclick="resolve(${x.id})">🛠️ مدیریت بحران</button></div></div>`}
function map(){let c=S.city;return `<div class="section"><h2>🗺️ نقشه زنده شهر</h2>${scene()}<div class="grid" style="margin-top:9px"><div class="card">🗺️ زمین<strong>${c.land}</strong></div><div class="card">🏘️ روستا<strong>${c.villages}</strong></div><div class="card">🏠 ظرفیت مسکن<strong>${num(c.housing_capacity)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><button class="btn primary" style="width:100%;margin-top:9px" onclick="expand()">🏘️ جذب روستا</button></div>`}
function economy(){let c=S.city,r=S.resources;return `<div class="section"><h2>💰 اقتصاد شهر</h2><div class="grid"><div class="card">📈 قدرت اقتصاد<strong>${c.economy}%</strong></div><div class="card">🏷️ مالیات<strong>${c.tax_rate}%</strong></div><div class="card">👥 جمعیت<strong>${num(c.population)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><div class="buttons" style="margin-top:9px"><button class="btn primary" onclick="act({action:'tax_up'})">📈 مالیات +۲٪</button><button class="btn" onclick="act({action:'tax_down'})">📉 مالیات -۲٪</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function market(){let offers=S.offers||[];return `<div class="section"><h2>🏪 بازار شهر</h2>${offers.length?offers.map(o=>`<div class="row"><div><b>${resNames[o.resource_type]||o.resource_type}</b> × ${num(o.amount)}<br><span class="muted">${num(o.price)} سکه · فروشنده: ${esc(o.first_name||'شهردار')}</span></div><button onclick="buy(${o.id})">🛒 خرید</button></div>`).join(''):'<div class="card">بازار فعلاً خالی است.</div>'}<button class="btn primary" style="width:100%;margin-top:9px" onclick="sellForm()">📤 فروش منابع</button></div>`}
function sellForm(){document.getElementById('app').innerHTML=`<div class="section"><h2>📤 فروش منابع</h2><select id="sr" class="input"><option value="food">🍞 غذا</option><option value="materials">🧱 مصالح</option><option value="energy">⚡ انرژی</option><option value="water">💧 آب</option><option value="equipment">🧰 تجهیزات</option></select><input id="sa" class="input" type="number" placeholder="مقدار"><input id="sp" class="input" type="number" placeholder="قیمت کل به سکه"><button class="btn primary" style="width:100%" onclick="sell()">📤 ثبت فروش</button><button class="btn" style="width:100%;margin-top:8px" onclick="show('market')">🔙 بازار</button></div>`}
function social(){let f=S.social?.friends||[],p=S.social?.pending||[];return `<div class="section"><h2>🤝 اجتماعی</h2><div class="card"><b>👥 دوستان: ${f.length}</b><br>${f.length?f.map(x=>`<span class="tag">${esc(x.first_name)} · ${esc(x.city_name)}</span>`).join(' '):'<span class="muted">هنوز دوستی ثبت نشده.</span>'}</div><div class="card" style="margin-top:8px"><b>📨 درخواست‌ها</b>${p.length?p.map(x=>`<div class="row"><span>${esc(x.first_name)} · ${x.user_id}</span><button onclick="acceptFriend(${x.id})">✅ قبول</button></div>`).join(''):'<div class="muted">درخواست جدیدی نداری.</div>'}</div><input id="fid" class="input" type="number" placeholder="شناسه عددی بازیکن"><button class="btn primary" style="width:100%" onclick="sendFriend()">📨 ارسال درخواست دوستی</button></div>`}
function ranking(){let r=S.ranking||{};return `<div class="section"><h2>🏆 رقابت هفتگی</h2><div class="card">📅 هفته: ${esc(r.week||'-')}<br>📍 رتبه تو: <b>${r.my_rank||'-'}</b> · امتیاز: <b>${num(r.my_score)}</b></div>${(r.top||[]).map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(''+(i+1)+'.')} ${esc(x.first_name)}<br><small class="muted">${esc(x.city_name)}</small></span><b>${num(x.score)}</b></div>`).join('')}</div>`}
function news(){return `<div class="section"><h2>📰 روزنامه شهر</h2>${S.news?.length?S.news.map(n=>`<div class="card" style="margin:7px 0">${esc(n.text)}<div class="muted" style="margin-top:5px">${fmtDate(n.created_at)}</div></div>`).join(''):'<div class="card">هنوز خبر خاصی ثبت نشده.</div>'}</div>`}
function more(){return `<div class="section"><h2>🏙️ امکانات شهر</h2><div class="buttons"><button class="btn" onclick="show('resources')">📦 منابع</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button><button class="btn" onclick="show('social')">🤝 اجتماعی</button><button class="btn" onclick="show('ranking')">🏆 رقابت</button><button class="btn" onclick="show('news')">📰 روزنامه</button><button class="btn" onclick="show('map')">🗺️ توسعه</button><button class="btn" onclick="show('buildings')">🏗️ ساختمان‌ها</button><button class="btn" onclick="show('crisis')">🚨 بحران‌ها</button></div></div>`}
function resources(){return `<div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div><div class="muted" style="margin-top:10px">درآمد پایه هر منبع: ۲۰ واحد در ساعت. درآمد ساختمان‌های مرتبط با ساخت/ارتقا در محاسبات شهر اعمال می‌شود.</div></div>`}
let currentPage='home';
function show(p){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let id=['home','buildings','crisis','map','more'].includes(p)?p:'more';document.getElementById('n-'+id).classList.add('active');let html={home,buildings,crisis,map,more,economy,market,social,ranking,news,resources}[p]?.();document.getElementById('app').innerHTML=html||more()}
async function refreshState(silent=false){try{let oldEvent=S?.live_events?.[0]?.id;let page=currentPage;let d=await api('/webapp/api/state');if(d?.ok===false)throw Error(d.message||'خطا');S=d;document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show(page);let newEvent=S.live_events?.[0];if(newEvent&&newEvent.id!==oldEvent&&!silent)toast('🚨 '+(newEvent.disaster_name||'حادثه جدید')+' در شهرت رخ داد!')}catch(e){if(!silent)toast('❌ '+(e.message||'خطا در بروزرسانی'))}}
async function load(){try{S=await api('/webapp/api/state');if(S?.ok===false)throw Error(S.message||'خطا');document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show('home')}catch(e){document.getElementById('app').innerHTML='<div class="loader">❌ '+esc(e.message||'خطای نامشخص')+'<br><small>Mini App نتوانست اطلاعات شهر را دریافت کند.</small></div>'}}
async function act(payload){try{let page=currentPage;let d=await api('/webapp/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast(d.message||'انجام شد');await refreshState(true);show(page)}catch(e){toast('❌ '+e.message)}}
function build(k){if(confirm('ساخت/ارتقای این ساختمان شروع شود؟'))act({action:'build',building:k)});}
function resolve(id){if(confirm('بحران مدیریت شود؟'))act({action:'resolve',crisis_id:id})}
function expand(){if(confirm('روستای جدید اضافه شود؟'))act({action:'expand_village'})}
function buy(id){if(confirm('این پیشنهاد خریداری شود؟'))act({action:'market_buy',offer_id:id})}
function sell(){act({action:'market_sell',resource:document.getElementById('sr').value,amount:Number(document.getElementById('sa').value),price:Number(document.getElementById('sp').value)})}
function sendFriend(){act({action:'friend_request',user_id:Number(document.getElementById('fid').value)})}
function acceptFriend(id){act({action:'friend_accept',request_id:id})}
function repair(id){if(confirm('خسارت با هزینه فعلی تعمیر شود؟'))act({action:'damage_repair',event_id:id})}
setInterval(()=>{if(S)refreshState(false)},15000);
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3200)}function num(x){return Number(x||0).toLocaleString('fa-IR')}function fmtDate(x){if(!x)return '-';try{return new Date(x).toLocaleString('fa-IR')}catch(e){return String(x)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script></body></html>
