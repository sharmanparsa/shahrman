<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let S=null;
const names={police:'🚓 پلیس',fire:'🚒 آتش‌نشانی',hospital:'🏥 بیمارستان',power:'⚡ نیروگاه',water:'💧 تصفیه‌خانه',school:'🏫 مدرسه',university:'🎓 دانشگاه',park:'🌳 پارک',shopping:'🏪 مرکز تجاری',stadium:'🏟️ ورزشگاه',recycling:'♻️ بازیافت',emergency:'🚑 مرکز امداد',roads:'🛣️ راه‌ها',waste:'🗑️ مدیریت پسماند',industry:'🏭 صنعت'};
const resNames={coins:'💰 سکه',materials:'🧱 مصالح',food:'🍞 غذا',energy:'⚡ انرژی',water:'💧 آب',equipment:'🧰 تجهیزات'};
const crisisNames={theft:'دزدی',fire:'آتش‌سوزی',disease:'بیماری',power:'قطعی برق',water:'کمبود آب',pollution:'آلودگی',storm:'طوفان',snow:'برف شدید',heat:'گرمای شدید',garbage:'انباشت زباله',accident:'حادثه',economic:'بحران اقتصادی',flood:'سیل',cold:'سرما',infrastructure:'زیرساخت'};
async function api(path,opt={}){
  opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':tg?.initData||'','X-Telegram-User-Id':String(tg?.initDataUnsafe?.user?.id||'')};
  const pageParams=new URLSearchParams(window.location.search);
  const authKeys=['uid','exp','sig'];
  const hasAuth=authKeys.every(k=>pageParams.has(k));
  if(hasAuth){
    const sep=path.includes('?')?'&':'?';
    path+=sep+'uid='+encodeURIComponent(pageParams.get('uid'))+'&exp='+encodeURIComponent(pageParams.get('exp'))+'&sig='+encodeURIComponent(pageParams.get('sig'));
  }
  let r=await fetch(path,opt);let raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error(raw||('خطای سرور '+r.status))}if(!r.ok)throw Error(d.message||d.text||'خطای سرور');return d
}
function buildingMarkup(k,lv,label){
 const common=`<div class="shadow"></div>`;
 if(!lv)return `<div class="slot locked"><div class="block"></div><div class="lock">🔒</div><div class="locked-label">${esc(label)} · قفل</div></div>`;
 let inner='';
 switch(k){
  case 'police': inner='<div class="bld police lv'+Math.min(lv,5)+'"><div class="tower"></div><div class="roof"></div><div class="body"><div class="window"></div><div class="badge">★</div></div><div class="sign">پلیس</div></div>';break;

  case 'power': inner='<div class="bld power lv'+Math.min(lv,5)+'"><div class="tower a"></div><div class="tower b"></div><div class="body"></div><div class="smoke">☁️</div><div class="sign">نیروگاه</div></div>';break;
  case 'water': inner='<div class="bld water lv'+Math.min(lv,5)+'"><div class="tank"></div><div class="legs"></div><div class="body"></div><div class="sign">آب</div></div>';break;
  case 'school': inner='<div class="bld school lv'+Math.min(lv,5)+'"><div class="roof"></div><div class="body"><div class="window"></div></div><div class="flag">🏫</div><div class="sign">مدرسه</div></div>';break;
  case 'university': inner='<div class="bld university lv'+Math.min(lv,5)+'"><div class="tower"><div class="window"></div></div><div class="body"></div><div class="roof"></div><div class="sign">دانشگاه</div></div>';break;
  case 'park': inner='<div class="bld park lv'+Math.min(lv,5)+'"><div class="body"></div><div class="tree1">🌳</div><div class="tree2">🌳</div><div class="tree3">🌳</div><div class="sign">پارک</div></div>';break;
  case 'shopping': inner='<div class="bld shopping lv'+Math.min(lv,5)+'"><div class="roof"></div><div class="body"><div class="window"></div></div><div class="sign">مرکز تجاری</div></div>';break;
  case 'stadium': inner='<div class="bld stadium lv'+Math.min(lv,5)+'"><div class="body"><div class="field"></div></div><div class="sign">ورزشگاه</div></div>';break;
  case 'recycling': inner='<div class="bld recycling lv'+Math.min(lv,5)+'"><div class="roof"></div><div class="body"><div class="symbol">♻</div></div><div class="sign">بازیافت</div></div>';break;
  case 'emergency': inner='<div class="bld emergency lv'+Math.min(lv,5)+'"><div class="roof"></div><div class="body"><div class="symbol">🚑</div></div><div class="sign">امداد</div></div>';break;
  case 'roads': inner='<div class="bld roads lv'+Math.min(lv,5)+'"><div class="body"></div><div class="cone a">🚧</div><div class="cone b">🚧</div><div class="sign">راه‌ها</div></div>';break;
  case 'waste': inner='<div class="bld waste lv'+Math.min(lv,5)+'"><div class="body"></div><div class="bin a">🗑️</div><div class="bin b">🗑️</div><div class="sign">پسماند</div></div>';break;
  case 'industry': inner='<div class="bld industry lv'+Math.min(lv,5)+'"><div class="roof"></div><div class="body"></div><div class="stack"></div><div class="smoke">☁️</div><div class="sign">صنعت</div></div>';break;
 }
 return `<div class="slot">${common}${inner}</div>`;
}
function scene(){
 let c=S.city||{}, levels=Object.fromEntries((S.buildings||[]).map(x=>[x.type,Number(x.level||0)]));
 const order=['police','fire','hospital','power','water','school','university','park','shopping','stadium','recycling','emergency','roads','waste','industry'];
 const pos=[[7,10],[29,8],[52,9],[74,8],[7,30],[30,29],[53,30],[75,29],[5,57],[28,55],[52,57],[76,55],[15,78],[48,77],[73,76]];
 const fields=[[2,5,25,18],[37,4,24,18],[67,4,28,19],[2,67,20,25],[57,66,21,25],[78,42,18,22]];
 const fieldHtml=fields.map(p=>`<div class="field" style="left:${p[0]}%;top:${p[1]}%;width:${p[2]}%;height:${p[3]}%"></div>`).join('');
 const blocks=pos.map(p=>`<div class="block" style="left:${p[0]}%;top:${p[1]}%"></div>`).join('');
 const buildings=order.map((k,i)=>`<div style="position:absolute;left:${pos[i][0]}%;top:${pos[i][1]}%;width:122px;height:92px">${buildingMarkup(k,levels[k]||0,names[k]||k)}</div>`).join('');
 const housesPos=[[2,21],[20,20],[40,20],[61,20],[82,20],[18,42],[38,43],[59,43],[84,44],[18,63],[39,65],[61,62],[86,64],[29,86],[59,86]];
 const houses=housesPos.map((p,i)=>`<div class="bld houseMini" style="position:absolute;left:${p[0]}%;top:${p[1]}%;z-index:6;transform:scale(${0.65+(i%3)*.08});"><div style="width:46px;height:26px;background:${['#c76b50','#b95c47','#d39a52','#6c82a9'][i%4]};clip-path:polygon(50% 0,100% 60%,88% 70%,50% 28%,12% 70%,0 60%)"></div><div style="width:34px;height:24px;margin:-2px auto 0;background:#dfcfad;border:2px solid #6a5945;border-radius:3px"><span style="display:block;width:7px;height:7px;background:#83c9d9;margin:5px auto"></span></div></div>`).join('');
 const trees=[[4,39],[22,4],[36,39],[67,39],[92,31],[9,72],[35,70],[68,69],[93,78],[44,92]].map(p=>`<div class="tree" style="left:${p[0]}%;top:${p[1]}%">🌳</div>`).join('');
 let activity=Math.max(3,Math.min(18,Math.round((Number(c.population||100)/35)*(Number(c.satisfaction||70)/70))));
 if(Number(c.satisfaction||70)<40) activity=Math.max(2,Math.floor(activity*.45));
 if(S.crisis) activity=Math.max(2,Math.floor(activity*.6));
 let people=Array.from({length:activity},(_,i)=>`<div class="person" style="left:${(5+i*17)%88}%;top:${30+(i*13)%58}%;animation-delay:-${i*.6}s"></div>`).join('');
 let cars=Array.from({length:Math.min(7,3+Math.floor(activity/3))},(_,i)=>`<div class="car ${['yellow','red','blue',''][i%4]}" style="left:${-8+i*15}%;top:${46+(i%3)*14}%;animation-delay:-${i*1.1}s"></div>`).join('');
 let ev=S.live_events?.[0], weather='', mark='';
 if(ev){let dn=String(ev.disaster_name||'');if(/⚡|صاعقه|رعد/.test(dn))weather='<div class="weather show"><div class="stormflash"></div><div class="lightning">⚡</div></div>';else if(/🔥|آتش/.test(dn))weather='<div class="weather show"><div class="fireglow" style="right:25%;top:42%"></div><div class="smokecloud" style="right:27%;top:31%"></div></div>';else if(/🌧️|باران|سیل|🌊|برف|❄/.test(dn))weather='<div class="weather show"><div class="rain"></div></div>';}
 let idx=ev?order.indexOf(ev.building_type):-1;if(idx<0)idx=0;if(ev){let pp=pos[idx];mark=`<div class="damage-mark" style="left:${pp[0]+4}%;top:${pp[1]-3}%">⚠️</div>`;}
 let banner=ev?`<div class="crisisBanner">🚨 ${esc(ev.disaster_name)} · ${ev.building_type?(names[ev.building_type]||ev.building_type):'شهر'}${ev.damage?` · خسارت ${num(ev.damage)} 🪙`:''}</div>`:(S.crisis?`<div class="crisisBanner">⚠️ بحران فعال: ${crisisNames[S.crisis.crisis_type]||esc(S.crisis.crisis_type)}</div>`:'');
 return `<div class="town"><div class="town-title">🏙️ ${esc(c.city_name||'شهر من')}<br><small>👑 ${esc(S.player?.first_name||'شهردار')} · ⭐ سطح ${S.player?.level||1}</small></div>${banner}<div class="ground">${fieldHtml}<div class="road h"></div><div class="road v"></div><div class="road h2"></div><div class="road v2"></div><div class="road d1"></div><div class="road d2"></div>${blocks}${houses}${trees}${buildings}${people}${cars}</div>${weather}${mark}<div class="town-stats"><div class="stat">👥<b>${num(c.population)}</b>جمعیت</div><div class="stat">😊<b>${c.satisfaction}%</b>رضایت</div><div class="stat">📈<b>${c.economy}%</b>اقتصاد</div></div></div>`;
}
function home(){let c=S.city;return scene()+`<div class="section"><h2>📊 وضعیت شهر</h2><div class="grid"><div class="card">🛡️ امنیت<strong>${c.security}%</strong></div><div class="card">❤️ سلامت<strong>${c.health}%</strong></div><div class="card">⚡ برق<strong>${c.power}%</strong></div><div class="card">💧 آب<strong>${c.water}%</strong></div><div class="card">🎓 آموزش<strong>${c.education}%</strong></div><div class="card">🌳 تفریح<strong>${c.recreation}%</strong></div></div></div><div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div></div><div class="section"><div class="buttons"><button class="btn primary" onclick="show('buildings')">🏗️ ساخت‌وساز</button><button class="btn ${S.crisis?'danger':'green'}" onclick="show('crisis')">${S.crisis?'🚨 بحران فعال':'✅ بحران‌ها'}</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function resourceCards(r){return Object.entries(resNames).map(([k,n])=>`<div class="card">${n}<strong>${num(r[k])}</strong><span class="muted">+۲۰ در ساعت پایه</span></div>`).join('')}
function buildings(){let map=Object.fromEntries((S.buildings||[]).map(x=>[x.type,x.level]));let active=S.construction;return `<div class="section"><h2>🏗️ ساختمان‌های شهر</h2>${active?`<div class="card">⏳ در حال ساخت: <b>${names[active.building_type]||active.building_type}</b><br><span class="muted">تا سطح ${active.target_level} · آماده: ${fmtDate(active.ready_at)}</span></div>`:''}${Object.entries(names).map(([k,n])=>{let lv=map[k]||0;return `<div class="row"><div><b>${n}</b><div class="muted">${lv?'سطح '+lv:'هنوز ساخته نشده'}</div></div><button onclick="build('${k}')">${lv?'⬆️ ارتقا':'🔨 ساخت'}</button></div>`}).join('')}</div><div class="section"><h2>🔧 خسارت‌ها</h2>${S.damages?.length?S.damages.map(d=>`<div class="row"><div>🚨 ${esc(d.disaster_name)}<br><span class="muted">${names[d.building_type]||d.building_type} · ${num(d.damage)} 🪙</span></div><button onclick="repair(${d.id})">🔧 تعمیر</button></div>`).join(''):'<div class="card">✅ خسارت فعالی وجود ندارد.</div>'}</div>`}
function crisis(){let x=S.crisis;if(!x)return `<div class="section"><h2>🚨 بحران‌ها</h2><div class="card" style="text-align:center">🌤️<br><strong>شهر آرام است</strong><br><span class="muted">فعلاً بحران فعالی وجود ندارد.</span></div></div>`;return `<div class="section"><h2>🚨 بحران فعال</h2><div class="card"><strong>⚠️ ${crisisNames[x.crisis_type]||esc(x.crisis_type)}</strong><p>شدت بحران: <b>${x.severity}</b></p><p class="muted">ایجاد: ${fmtDate(x.created_at)}</p><button class="btn primary" onclick="resolve(${x.id})">🛠️ مدیریت بحران</button></div></div>`}
function map(){let c=S.city;return `<div class="section"><h2>🗺️ نقشه زنده شهر</h2>${scene()}<div class="grid" style="margin-top:9px"><div class="card">🗺️ زمین<strong>${c.land}</strong></div><div class="card">🏘️ روستا<strong>${c.villages}</strong></div><div class="card">🏠 ظرفیت مسکن<strong>${num(c.housing_capacity)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><button class="btn primary" style="width:100%;margin-top:9px" onclick="expand()">🏘️ جذب روستا</button></div>`}
function economy(){let c=S.city,r=S.resources;return `<div class="section"><h2>💰 اقتصاد شهر</h2><div class="grid"><div class="card">📈 قدرت اقتصاد<strong>${c.economy}%</strong></div><div class="card">🏷️ مالیات<strong>${c.tax_rate}%</strong></div><div class="card">👥 جمعیت<strong>${num(c.population)}</strong></div><div class="card">💼 شغل<strong>${num(c.jobs)}</strong></div></div><div class="buttons" style="margin-top:9px"><button class="btn primary" onclick="act({action:'tax_up'})">📈 مالیات +۲٪</button><button class="btn" onclick="act({action:'tax_down'})">📉 مالیات -۲٪</button><button class="btn" onclick="show('market')">🏪 بازار</button></div></div>`}
function market(){let offers=S.offers||[];return `<div class="section"><h2>🏪 بازار شهر</h2>${offers.length?offers.map(o=>`<div class="row"><div><b>${resNames[o.resource_type]||o.resource_type}</b> × ${num(o.amount)}<br><span class="muted">${num(o.price)} سکه · فروشنده: ${esc(o.first_name||'شهردار')}</span></div><button onclick="buy(${o.id})">🛒 خرید</button></div>`).join(''):'<div class="card">بازار فعلاً خالی است.</div>'}<button class="btn primary" style="width:100%;margin-top:9px" onclick="sellForm()">📤 فروش منابع</button></div>`}
function sellForm(){document.getElementById('app').innerHTML=`<div class="section"><h2>📤 فروش منابع</h2><select id="sr" class="input"><option value="food">🍞 غذا</option><option value="materials">🧱 مصالح</option><option value="energy">⚡ انرژی</option><option value="water">💧 آب</option><option value="equipment">🧰 تجهیزات</option></select><input id="sa" class="input" type="number" placeholder="مقدار"><input id="sp" class="input" type="number" placeholder="قیمت کل به سکه"><button class="btn primary" style="width:100%" onclick="sell()">📤 ثبت فروش</button><button class="btn" style="width:100%;margin-top:8px" onclick="show('market')">🔙 بازار</button></div>`}
function social(){let f=S.social?.friends||[],p=S.social?.pending||[];return `<div class="section"><h2>🤝 اجتماعی</h2><div class="card"><b>👥 دوستان: ${f.length}</b><br>${f.length?f.map(x=>`<span class="tag">${esc(x.first_name)} · ${esc(x.city_name)}</span>`).join(' '):'<span class="muted">هنوز دوستی ثبت نشده.</span>'}</div><div class="card" style="margin-top:8px"><b>📨 درخواست‌ها</b>${p.length?p.map(x=>`<div class="row"><span>${esc(x.first_name)} · ${x.user_id}</span><button onclick="acceptFriend(${x.id})">✅ قبول</button></div>`).join(''):'<div class="muted">درخواست جدیدی نداری.</div>'}</div><input id="fid" class="input" type="number" placeholder="شناسه عددی بازیکن"><button class="btn primary" style="width:100%" onclick="sendFriend()">📨 ارسال درخواست دوستی</button></div>`}
function ranking(){let r=S.ranking||{};return `<div class="section"><h2>🏆 رقابت هفتگی</h2><div class="card">📅 هفته: ${esc(r.week||'-')}<br>📍 رتبه تو: <b>${r.my_rank||'-'}</b> · امتیاز: <b>${num(r.my_score)}</b></div>${(r.top||[]).map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]||(''+(i+1)+'.')} ${esc(x.first_name)}<br><small class="muted">${esc(x.city_name)}</small></span><b>${num(x.score)}</b></div>`).join('')}</div>`}
function news(){return `<div class="section"><h2>📰 روزنامه شهر</h2>${S.news?.length?S.news.map(n=>`<div class="card" style="margin:7px 0">${esc(n.text)}<div class="muted" style="margin-top:5px">${fmtDate(n.created_at)}</div></div>`).join(''):'<div class="card">هنوز خبر خاصی ثبت نشده.</div>'}</div>`}
function more(){return `<div class="section"><h2>🏙️ امکانات شهر</h2><div class="buttons"><button class="btn" onclick="show('resources')">📦 منابع</button><button class="btn" onclick="show('economy')">💰 اقتصاد</button><button class="btn" onclick="show('market')">🏪 بازار</button><button class="btn" onclick="show('social')">🤝 اجتماعی</button><button class="btn" onclick="show('ranking')">🏆 رقابت</button><button class="btn" onclick="show('news')">📰 روزنامه</button><button class="btn" onclick="show('map')">🗺️ توسعه</button><button class="btn" onclick="show('buildings')">🏗️ ساختمان‌ها</button><button class="btn" onclick="show('crisis')">🚨 بحران‌ها</button></div></div>`}
function resources(){return `<div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(S.resources)}</div><div class="muted" style="margin-top:10px">درآمد پایه هر منبع: ۲۰ واحد در ساعت. درآمد ساختمان‌های مرتبط با ساخت/ارتقا در محاسبات شهر اعمال می‌شود.</div></div>`}
let currentPage='home';
function show(p){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));let id=['home','buildings','crisis','map','more'].includes(p)?p:'more';document.getElementById('n-'+id).classList.add('active');let html={home,buildings,crisis,map,more,economy,market,social,ranking,news,resources}[p]?.();document.getElementById('app').innerHTML=html||more()}
async function refreshState(silent=false){try{let oldEvent=S?.live_events?.[0]?.id;let page=currentPage;let d=await api('/webapp/api/state');if(d?.ok===false)throw Error(d.message||'خطا');S=d;document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show(page);let newEvent=S.live_events?.[0];if(newEvent&&newEvent.id!==oldEvent&&!silent)toast('🚨 '+(newEvent.disaster_name||'حادثه جدید')+' در شهرت رخ داد!')}catch(e){if(!silent)toast('❌ '+(e.message||'خطا در بروزرسانی'))}}
async function load(){try{S=await api('/webapp/api/state');if(S?.ok===false)throw Error(S.message||'خطا');document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show('home')}catch(e){document.getElementById('app').innerHTML='<div class="loader">❌ '+esc(e.message||'خطای نامشخص')+'<br><small>Mini App نتوانست اطلاعات شهر را دریافت کند.</small></div>'}}
async function act(payload){try{let page=currentPage;let d=await api('/webapp/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast(d.message||'انجام شد');let fresh=await api('/webapp/api/state');if(fresh?.ok===false)throw Error(fresh.message||'خطا');S=fresh;document.getElementById('mayor').textContent='👑 '+(S.player?.first_name||'شهردار');show(page)}catch(e){toast('❌ '+e.message)}}
function build(k){if(confirm('ساخت/ارتقای این ساختمان شروع شود؟'))act({action:'build',building:k});}
function resolve(id){if(confirm('بحران مدیریت شود؟'))act({action:'resolve',crisis_id:id})}
function expand(){if(confirm('روستای جدید اضافه شود؟'))act({action:'expand_village'})}
function buy(id){if(confirm('این پیشنهاد خریداری شود؟'))act({action:'market_buy',offer_id:id})}
function sell(){act({action:'market_sell',resource:document.getElementById('sr').value,amount:Number(document.getElementById('sa').value),price:Number(document.getElementById('sp').value)})}
function sendFriend(){act({action:'friend_request',user_id:Number(document.getElementById('fid').value)})}
function acceptFriend(id){act({action:'friend_accept',request_id:id})}
function repair(id){if(confirm('خسارت با هزینه فعلی تعمیر شود؟'))act({action:'damage_repair',event_id:id})}
setInterval(()=>{if(S)refreshState(false)},15000);
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3200)}function num(x){return Number(x||0).toLocaleString('fa-IR')}function fmtDate(x){if(!x)return '-';try{return new Date(x).toLocaleString('fa-IR')}catch(e){return String(x)}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
load();
</script></body></html>
