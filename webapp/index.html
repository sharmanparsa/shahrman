<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>شهر من</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#07131a;--panel:#10242c;--panel2:#17333d;--gold:#f5bd4b;--green:#53d18b;--red:#ff6b6b;--text:#f5f8fa;--muted:#9eb2ba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1c3b47 0,#07131a 55%);font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;color:var(--text);min-height:100vh}.app{max-width:520px;margin:auto;padding:12px 12px 90px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}.title{font-size:23px;font-weight:900}.pill{background:#17343e;border:1px solid #28525e;padding:7px 10px;border-radius:14px;color:#d7e5e9;font-size:12px}.scene{height:330px;border-radius:26px;overflow:hidden;position:relative;border:1px solid #2b5662;box-shadow:0 18px 45px #0007;background:linear-gradient(#4b9ac1 0 48%,#89a36d 48% 100%)}.sun{position:absolute;width:58px;height:58px;border-radius:50%;background:#ffd36a;top:28px;left:34px;box-shadow:0 0 35px #ffd36a99}.mount{position:absolute;bottom:105px;width:100%;height:115px;background:#526c78;clip-path:polygon(0 100%,20% 30%,34% 72%,52% 15%,72% 70%,87% 28%,100% 70%,100% 100%)}.road{position:absolute;bottom:0;left:-5%;width:110%;height:105px;background:#3d4549;transform:rotate(-4deg)}.road:after{content:"";position:absolute;left:0;right:0;top:48%;border-top:5px dashed #e9cf6b}.citytitle{position:absolute;top:12px;right:14px;background:#07131ad9;padding:10px 14px;border-radius:16px;font-weight:900}.statbar{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#07131ad9;border:1px solid #315762;border-radius:13px;padding:7px;text-align:center;font-size:11px}.stat b{display:block;font-size:15px;margin-top:2px}.building{position:absolute;bottom:82px;width:64px;border-radius:7px 7px 2px 2px;background:#d6a86a;border:3px solid #754d37;box-shadow:0 8px 12px #0005}.building:before{content:"";position:absolute;left:-7px;right:-7px;top:-25px;border-left:35px solid transparent;border-right:35px solid transparent;border-bottom:25px solid #9a5e48}.building i{display:block;height:12px;margin:7px 6px;background:repeating-linear-gradient(90deg,#8bd0dd 0 9px,transparent 9px 15px)}.b1{right:25px;height:115px}.b2{right:105px;height:83px;background:#e2c278}.b3{right:185px;height:130px;background:#7cb3d4}.b4{right:265px;height:95px;background:#9a7bc0}.b5{right:345px;height:72px;background:#6fb982}.section{margin-top:12px;background:#10242ce8;border:1px solid #244953;border-radius:22px;padding:12px}.section h2{margin:0 0 10px;font-size:17px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.card{background:#17333d;border:1px solid #2a5662;border-radius:16px;padding:12px;min-height:86px}.card strong{font-size:18px}.muted{color:var(--muted);font-size:12px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.btn{border:0;border-radius:15px;padding:13px 8px;background:#1b3c47;color:#fff;font-weight:800;font-size:14px}.btn.primary{background:linear-gradient(135deg,#e4a72f,#f4ca62);color:#172229}.btn.danger{background:#6d3034}.btn.green{background:#216243}.hidden{display:none}.toast{position:fixed;left:14px;right:14px;bottom:18px;background:#0c1c23ee;border:1px solid #3c626d;padding:13px;border-radius:16px;text-align:center;z-index:9}.nav{position:fixed;bottom:0;left:0;right:0;background:#08161dcc;backdrop-filter:blur(15px);border-top:1px solid #274852;padding:9px;display:flex;justify-content:center;z-index:8}.navin{max-width:520px;width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nav button{background:transparent;border:0;color:#a9c1c8;font-size:11px}.nav button b{display:block;font-size:20px}.active{color:#f7c65c!important}.tag{display:inline-block;padding:5px 8px;border-radius:10px;background:#17343e;color:#cfe0e5;font-size:11px;margin:2px}.buildingrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px;background:#17333d;border-radius:14px;margin:7px 0}.buildingrow button{border:0;border-radius:10px;padding:9px;background:#dca63b;color:#142027;font-weight:800}.loader{text-align:center;padding:40px;color:#b8cbd0}
</style></head><body><div class="app"><div class="top"><div class="title">🏙️ شهر من</div><div class="pill" id="mayor">در حال بارگذاری...</div></div><div id="app"><div class="loader">در حال ورود به شهر...</div></div></div><div class="nav"><div class="navin"><button onclick="show('home')" id="n-home"><b>🏙️</b>شهر</button><button onclick="show('buildings')" id="n-buildings"><b>🏗️</b>ساختمان</button><button onclick="show('crisis')" id="n-crisis"><b>🚨</b>بحران</button><button onclick="show('map')" id="n-map"><b>🗺️</b>نقشه</button><button onclick="show('more')" id="n-more"><b>📦</b>بیشتر</button></div></div><div id="toast" class="toast hidden"></div><script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();} let S=null;
const names={police:'🚓 پلیس',fire:'🚒 آتش‌نشانی',hospital:'🏥 بیمارستان',power:'⚡ نیروگاه',water:'💧 تصفیه‌خانه',school:'🏫 مدرسه',university:'🎓 دانشگاه',park:'🌳 پارک',shopping:'🏪 مرکز تجاری',stadium:'🏟️ ورزشگاه',recycling:'♻️ بازیافت',emergency:'🚑 مرکز امداد',roads:'🛣️ راه‌ها',waste:'🗑️ مدیریت پسماند',industry:'🏭 صنعت'};
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'X-Telegram-Init-Data':tg?.initData||''};let r=await fetch(path,opt);let raw=await r.text();let d;try{d=JSON.parse(raw)}catch(_){throw Error(raw||('خطای سرور: '+r.status))}if(!r.ok)throw Error(d.message||d.text||'خطا');return d}
async function load(){try{S=await api('/webapp/api/state');document.getElementById('mayor').textContent='👑 '+(S.player.first_name||'شهردار');show('home')}catch(e){document.getElementById('app').innerHTML='<div class="loader">❌ '+e.message+'<br><small>این صفحه باید از داخل تلگرام باز شود.</small></div>'}}
function scene(){let c=S.city,r=S.resources;return `<div class="scene"><div class="sun"></div><div class="mount"></div><div class="road"></div><div class="citytitle">🏙️ ${esc(c.city_name||'شهر من')}<br><small>👑 ${esc(S.player.first_name||'شهردار')} · ⭐ سطح ${S.player.level}</small></div><div class="building b1"><i></i><i></i></div><div class="building b2"><i></i></div><div class="building b3"><i></i><i></i><i></i></div><div class="building b4"><i></i><i></i></div><div class="building b5"><i></i></div><div class="statbar"><div class="stat">👥<b>${num(c.population)}</b>جمعیت</div><div class="stat">😊<b>${c.satisfaction}%</b>رضایت</div><div class="stat">📈<b>${c.economy}%</b>اقتصاد</div></div></div>`}
function home(){let c=S.city,r=S.resources;return scene()+`<div class="section"><h2>📊 وضعیت شهر</h2><div class="grid"><div class="card">🛡️ امنیت<strong>${c.security}%</strong></div><div class="card">❤️ سلامت<strong>${c.health}%</strong></div><div class="card">⚡ برق<strong>${c.power}%</strong></div><div class="card">💧 آب<strong>${c.water}%</strong></div></div></div><div class="section"><h2>📦 منابع</h2><div class="grid">${resourceCards(r)}</div></div><div class="section"><div class="buttons"><button class="btn primary" onclick="show('buildings')">🏗️ ساخت‌وساز</button><button class="btn ${S.crisis?'danger':'green'}" onclick="show('crisis')">${S.crisis?'🚨 بحران فعال':'✅ بدون بحران'}</button><button class="btn" onclick="show('map')">🗺️ نقشه شهر</button><button class="btn" onclick="show('more')">💰 اقتصاد و بازار</button></div></div>`}
function resourceCards(r){return [['💰','سکه','coins'],['🧱','مصالح','materials'],['🍞','غذا','food'],['⚡','انرژی','energy'],['💧','آب','water'],['🧰','تجهیزات','equipment']].map(x=>`<div class="card">${x[0]} ${x[1]}<strong>${num(r[x[2]])}</strong><span class="muted">+۲۰ در ساعت پایه</span></div>`).join('')}
function buildings(){let map=Object.fromEntries((S.buildings||[]).map(x=>[x.type,x.level]));let list=Object.entries(names);return `<div class="section"><h2>🏗️ شهر را بساز</h2><div class="muted">ساختمان‌ها روی رشد و وضعیت شهر اثر می‌گذارند.</div>${list.map(([k,n])=>{let lv=map[k]||0;return `<div class="buildingrow"><div><b>${n}</b><div class="muted">${lv?'سطح '+lv:'هنوز ساخته نشده'}</div></div><button onclick="build('${k}')">${lv?'⬆️ ارتقا':'🔨 ساخت'}</button></div>`}).join('')}</div>`}
function crisis(){let x=S.crisis;if(!x)return `<div class="section"><h2>🚨 بحران‌ها</h2><div class="card" style="text-align:center">🌤️<br><strong>شهر آرام است</strong><br><span class="muted">فعلاً بحران فعالی وجود ندارد.</span></div></div>`;return `<div class="section"><h2>🚨 بحران فعال</h2><div class="card"><strong>⚠️ ${esc(x.crisis_type)}</strong><p>شدت بحران: ${x.severity}</p><p>زمان ایجاد: ${esc(String(x.created_at||''))}</p><button class="btn primary" onclick="resolve(${x.id})">🛠️ مدیریت بحران</button></div></div>`}
function map(){let c=S.city;return `<div class="section"><h2>🗺️ نقشه زنده شهر</h2><div class="scene" style="height:430px"><div class="sun"></div><div class="mount"></div><div class="road"></div><div class="citytitle">زمین: ${c.land} · روستا: ${c.villages}</div><div class="building b1"><i></i><i></i></div><div class="building b2"><i></i></div><div class="building b3"><i></i><i></i></div><div class="building b4"><i></i></div><div class="building b5"><i></i></div></div><p class="muted">🏘️ توسعه شهر، ظرفیت مسکن و مناطق مختلف از همین بخش مدیریت می‌شوند.</p><button class="btn primary" onclick="expand()">🏘️ جذب روستا</button></div>`}
function more(){return `<div class="section"><h2>🎮 امکانات شهر</h2><div class="buttons"><button class="btn" onclick="show('home')">🏙️ داشبورد</button><button class="btn" onclick="show('buildings')">🏗️ ساختمان‌ها</button><button class="btn" onclick="show('crisis')">🚨 بحران‌ها</button><button class="btn" onclick="show('map')">🗺️ توسعه</button></div></div><div class="section"><h2>🏪 بازار</h2><div class="muted">بازار فعلی ربات بدون تغییر در منطق قبلی در دسترس است.</div><div class="buttons" style="margin-top:10px"><button class="btn primary" onclick="openBot('market')">🏪 باز کردن بازار ربات</button></div></div>`}
function show(p){['home','buildings','crisis','map','more'].forEach(x=>document.getElementById('n-'+(x==='home'?'home':x==='more'?'more':x)).classList.remove('active'));document.getElementById('n-'+(p==='home'?'home':p==='more'?'more':p)).classList.add('active');document.getElementById('app').innerHTML=p==='home'?home():p==='buildings'?buildings():p==='crisis'?crisis():p==='map'?map():more()}
async function act(payload){try{let d=await api('/webapp/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});toast(d.message);await load()}catch(e){toast('❌ '+e.message)}}
function build(k){if(confirm('ساخت/ارتقای این ساختمان شروع شود؟'))act({action:'build',building:k})}function resolve(id){if(confirm('بحران مدیریت شود؟'))act({action:'resolve',crisis_id:id})}function expand(){if(confirm('برای جذب روستا هزینه اعمال شود؟'))act({action:'expand_village'})}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3500)}function num(x){return Number(x||0).toLocaleString('fa-IR')}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function openBot(cb){if(tg){tg.close();} }load();
</script></body></html>
